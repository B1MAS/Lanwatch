name: Поддержка нового роутера
description: Предложить модель для нового read-only адаптера
title: "[Router]: "
labels: [router-support]
body:
  - type: markdown
    attributes:
      value: |
        Перед заполнением прочитайте [инструкцию «Добавить свой роутер»](https://github.com/B1MAS/lanwatch/blob/main/docs/ADD_ROUTER.md).

        Не прикладывайте дампы трафика, резервные копии, пароли, токены, полные ответы API и списки устройств. Безопасный `lanwatch-probe.json` всё равно проверьте вручную перед публикацией.
  - type: input
    id: vendor
    attributes:
      label: Производитель и модель
      placeholder: GL.iNet Flint 2 (GL-MT6000)
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Версия прошивки
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: Известный локальный API
      options:
        - OpenWrt ubus
        - API производителя
        - Неизвестно
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Результат безопасного probe
      description: Приложите вручную проверенный lanwatch-probe.json или вставьте его обезличенное содержимое.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед публикацией
      options:
        - label: Я проверил файл и убедился, что в нём нет паролей, токенов, cookies, SSID, MAC/IP устройств и других данных моей сети.
          required: true
